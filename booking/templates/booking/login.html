{% extends "booking/base.html" %}
{% block title %}Login | MovieTime{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card bg-dark text-white border-secondary p-4 mx-auto" style="max-width:400px;">
        <h3 class="text-center mb-4">Login to Book Tickets</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-book w-100 mt-3">Login</button>
        </form>
        <p class="text-center mt-3 text-muted">
            Don't have an account? <a href="{% url 'signup' %}" class="text-white">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
