{% extends "booking/base.html" %}
{% block title %}Sign Up | MovieTime{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card bg-dark text-white border-secondary p-4 mx-auto" style="max-width:400px;">
        <h3 class="text-center mb-4">Create Account</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-book w-100 mt-3">Sign Up</button>
        </form>
        <p class="text-center mt-3 text-muted">
            Already have an account? <a href="{% url 'login' %}" class="text-white">Login</a>
        </p>
    </div>
</div>

<!-- Form fields ko dark theme me dikhane ke liye CSS -->
<style>
    #id_username, #id_password1, #id_password2 {
        width: 100%; padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px;
    }
    .helptext { font-size: 11px; color: #a5a5b2; display: block; margin-bottom: 10px; }
</style>
{% endblock %}
